services:
  - type: web
    name: tiendaropa
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn tienda.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "True"
